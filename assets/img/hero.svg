<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdeef2"/>
      <stop offset="0.45" stop-color="#e7a3bd"/>
      <stop offset="1" stop-color="#a94f72"/>
    </linearGradient>
    <g id="sprig1" stroke-linecap="round">
      <path d="M0 0 C 60 -20 120 -30 190 -18" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="2.5"/>
      <g fill="#fff" fill-opacity="0.4">
        <ellipse cx="35" cy="-14" rx="17" ry="7" transform="rotate(-24 35 -14)"/>
        <ellipse cx="70" cy="-22" rx="18" ry="7.5" transform="rotate(-20 70 -22)"/>
        <ellipse cx="108" cy="-26" rx="18" ry="7.5" transform="rotate(-14 108 -26)"/>
        <ellipse cx="146" cy="-25" rx="16" ry="7" transform="rotate(-8 146 -25)"/>
        <ellipse cx="55" cy="-2" rx="16" ry="6.5" transform="rotate(20 55 -2)"/>
        <ellipse cx="92" cy="-6" rx="17" ry="7" transform="rotate(16 92 -6)"/>
        <ellipse cx="130" cy="-8" rx="15" ry="6.5" transform="rotate(10 130 -8)"/>
      </g>
    </g>
  </defs>

  <rect width="1600" height="700" fill="url(#g1)"/>

  <!-- 부드러운 보케 원 -->
  <g fill="#fff">
    <circle cx="1290" cy="150" r="150" opacity="0.10"/>
    <circle cx="1440" cy="330" r="90"  opacity="0.08"/>
    <circle cx="1180" cy="70"  r="60"  opacity="0.12"/>
    <circle cx="240"  cy="600" r="120" opacity="0.06"/>
  </g>

  <!-- 흩날리는 반짝임 -->
  <g fill="#fff">
    <circle cx="520"  cy="120" r="4" opacity="0.5"/>
    <circle cx="760"  cy="80"  r="3" opacity="0.45"/>
    <circle cx="980"  cy="180" r="5" opacity="0.4"/>
    <circle cx="1120" cy="420" r="4" opacity="0.4"/>
  </g>

  <!-- 잎사귀 가지 (모서리 장식) -->
  <use href="#sprig1" transform="translate(-10 90) scale(1.1)"/>
  <use href="#sprig1" transform="translate(1600 60) scale(1.25) rotate(174)"/>
  <use href="#sprig1" transform="translate(1600 660) scale(1.15) rotate(196)"/>

  <!-- 웨딩 링 모티프 -->
  <g transform="translate(1250 470)" fill="none" stroke-width="9">
    <circle cx="0"  cy="0" r="66" stroke="#f3dcae" opacity="0.85"/>
    <circle cx="78" cy="0" r="66" stroke="#fff" opacity="0.7"/>
    <path d="M0 -66 l -13 -18 l 13 -16 l 13 16 z" fill="#fff6e2" stroke="none"/>
  </g>
</svg>
